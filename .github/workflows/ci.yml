name: Titanus Core CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Titanus
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Normalize Go formatting on runner
        run: gofmt -w ./cmd ./internal

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Smoke CLI
        run: ./bin/titanus version

  runtime-smoke:
    name: Native Unit runtime smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Titanus
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build Titanus
        run: make build

      - name: Install static BusyBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox-static iproute2 nftables util-linux

      - name: Validate Fabric nftables rules
        run: sudo env "PATH=$PATH" go test ./internal/fabric -run 'TestRendered(NAT|Policy)RulesPassNftCheck' -v

      - name: Build minimal Titanus Source
        run: |
          mkdir -p /tmp/titanus-rootfs/bin
          cp "$(command -v busybox)" /tmp/titanus-rootfs/bin/busybox
          ln -s busybox /tmp/titanus-rootfs/bin/sh
          ln -s busybox /tmp/titanus-rootfs/bin/sleep

      - name: Exercise native Unit runtime
        run: |
          set -euxo pipefail
          STATE=/tmp/titanus-ci-state
          CGROUP=/sys/fs/cgroup/titanus-ci
          INIT="$GITHUB_WORKSPACE/bin/titanus-init"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus source import busybox /tmp/titanus-rootfs

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus fabric init --cidr 10.249.0.0/24 --bridge titanus-ci0

          sudo env TITANUS_STATE_ROOT="$STATE" ./bin/titanus disk create smoke-data --provider local --size 64M

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit create smoke --source busybox --memory 64M --cpu 50 --pids 64 --fabric \
            --mount smoke-data:/data -- \
            /bin/sh -c 'echo TITANUS_RUNTIME_OK; echo PERSISTENT_OK > /data/proof; /bin/busybox grep -E "^(NoNewPrivs|Seccomp|CapEff):" /proc/self/status; sleep 30'

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit start smoke

          sleep 1

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit inspect smoke | tee /tmp/titanus-inspect.json
          grep -q '"status": "ACTIVE"' /tmp/titanus-inspect.json
          grep -q '"network_address": "10.249.0.10"' /tmp/titanus-inspect.json

          sudo nsenter -t "$(jq -r '.state.pid' /tmp/titanus-inspect.json)" -n ip addr show eth0 | grep -q '10.249.0.10/24'
          sudo grep -q 'search titanus' "$STATE/units/smoke/rootfs/etc/resolv.conf"
          sudo grep -q 'nameserver 10.249.0.1' "$STATE/units/smoke/rootfs/etc/resolv.conf"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit logs smoke | tee /tmp/titanus-smoke.log
          grep -q TITANUS_RUNTIME_OK /tmp/titanus-smoke.log
          grep -Eq 'NoNewPrivs:[[:space:]]+1' /tmp/titanus-smoke.log
          grep -Eq 'Seccomp:[[:space:]]+2' /tmp/titanus-smoke.log
          grep -Eq 'CapEff:[[:space:]]+0+' /tmp/titanus-smoke.log

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit create strict-smoke --source busybox --memory 64M --cpu 25 --pids 32 \
            --uid 65534 --gid 65534 --read-only-rootfs -- \
            /bin/sh -c 'echo UID=$(/bin/busybox id -u) GID=$(/bin/busybox id -g); if echo DENIED > /rootfs-write-test; then exit 91; else echo ROOTFS_RO_OK; fi; echo TMP_OK > /tmp/proof; sleep 30'

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit start strict-smoke
          sleep 1
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit logs strict-smoke | tee /tmp/titanus-strict.log
          grep -q 'UID=65534 GID=65534' /tmp/titanus-strict.log
          grep -q ROOTFS_RO_OK /tmp/titanus-strict.log

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit stop strict-smoke
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit delete strict-smoke

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit stop smoke

          sudo grep -q PERSISTENT_OK "$STATE/disks/smoke-data/data/proof"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit delete smoke
