name: Titanus Core CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Titanus
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Normalize Go formatting on runner
        run: gofmt -w ./cmd ./internal

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race checks
        run: go test -race ./internal/disk ./cmd/titanus-init ./internal/identity ./internal/controlapi ./cmd/titanus-agent ./internal/security ./internal/unitruntime ./internal/lease ./internal/realm ./internal/reconcile ./internal/consensus ./internal/controllerclient

      - name: Cross-build native ARM64 runtime
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/titanus-init-arm64 ./cmd/titanus-init
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/titanus-arm64 ./cmd/titanus

      - name: Build
        run: make build

      - name: Smoke CLI
        run: ./bin/titanus version

  runtime-smoke:
    name: Native Unit runtime (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Titanus
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build Titanus
        run: make build

      - name: Install static BusyBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox-static iproute2 nftables util-linux

      - name: Validate Fabric nftables rules
        run: sudo env "PATH=$PATH" go test ./internal/fabric -run 'TestRendered(NAT|Policy)RulesPassNftCheck' -v

      - name: Validate kernel security enforcement
        run: sudo env "PATH=$PATH" TITANUS_SECURITY_KERNEL_TEST=1 go test ./internal/security -run TestKernelSecurity -v

      - name: Build minimal Titanus Source
        run: |
          mkdir -p /tmp/titanus-rootfs/bin
          cp "$(command -v busybox)" /tmp/titanus-rootfs/bin/busybox
          ln -s busybox /tmp/titanus-rootfs/bin/sh
          ln -s busybox /tmp/titanus-rootfs/bin/sleep
          CGO_ENABLED=0 go build -o /tmp/titanus-rootfs/bin/security-probe ./internal/security/testprobe
          CGO_ENABLED=0 go build -o /tmp/titanus-rootfs/bin/isolation-probe ./internal/security/isolationprobe
          CGO_ENABLED=0 go build -o /tmp/titanus-rootfs/bin/health-app ./internal/unitruntime/testapp
          CGO_ENABLED=0 go build -o /tmp/titanus-rootfs/bin/rollout-app ./internal/unitruntime/rolloutapp

      - name: Verify mapped namespaces, device and LSM kernel enforcement
        run: sudo env "PATH=$PATH" TITANUS_ISOLATION_KERNEL_TEST=1 TITANUS_INIT_BINARY="$PWD/bin/titanus-init" go test ./internal/unitruntime -run 'TestNative(Isolation|DiskOwnership)' -count=1 -v -timeout 180s

      - name: Verify replicated Control-plane HA on native architecture
        run: go test -race ./internal/consensus ./internal/controllerclient -count=1 -timeout 180s

      - name: Kill and recover real HA daemons
        run: sudo env "PATH=$PATH" TITANUS_HA_DAEMON_TEST=1 TITANUS_DAEMON_BINARY="$PWD/bin/titanusd" go test ./cmd/titanusd -run TestNativeHADaemonCrash -count=1 -v -timeout 180s

      - name: Exercise native Unit runtime
        run: |
          set -euxo pipefail
          STATE=/tmp/titanus-ci-state
          CGROUP=/sys/fs/cgroup/titanus-ci
          INIT="$GITHUB_WORKSPACE/bin/titanus-init"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus source import busybox /tmp/titanus-rootfs

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus fabric init --cidr 10.249.0.0/24 --bridge titanus-ci0

          sudo env TITANUS_STATE_ROOT="$STATE" ./bin/titanus disk create smoke-data --provider local --size 64M
          # Test fixture only: production Disks need explicit mapped ownership.
          sudo chmod 0777 "$STATE/disks/smoke-data/data"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit create smoke --source busybox --memory 64M --cpu 50 --pids 64 --fabric \
            --mount smoke-data:/data -- \
            /bin/sh -ec '/bin/security-probe verify 0; echo TITANUS_RUNTIME_OK; echo PERSISTENT_OK > /data/proof; sleep 30'

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit start smoke

          sleep 1

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit inspect smoke | tee /tmp/titanus-inspect.json
          grep -q '"status": "ACTIVE"' /tmp/titanus-inspect.json
          grep -q '"network_address": "10.249.0.10"' /tmp/titanus-inspect.json
          jq -e '.spec.security.no_new_privs == true and .spec.security.seccomp == "titanus-default-v1"' /tmp/titanus-inspect.json
          PID=$(jq -r '.state.pid' /tmp/titanus-inspect.json)
          sudo grep -Eq '^NoNewPrivs:[[:space:]]+1$' "/proc/$PID/status"
          sudo grep -Eq '^Seccomp:[[:space:]]+2$' "/proc/$PID/status"
          for SET in CapInh CapPrm CapEff CapBnd CapAmb; do
            sudo grep -Eq "^$SET:[[:space:]]+0000000000000000$" "/proc/$PID/status"
          done

          sudo nsenter -t "$(jq -r '.state.pid' /tmp/titanus-inspect.json)" -n ip addr show eth0 | grep -q '10.249.0.10/24'
          sudo grep -q 'search titanus' "$STATE/units/smoke/rootfs/etc/resolv.conf"
          sudo grep -q 'nameserver 10.249.0.1' "$STATE/units/smoke/rootfs/etc/resolv.conf"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit logs smoke | grep -q TITANUS_RUNTIME_OK
          sudo env TITANUS_STATE_ROOT="$STATE" ./bin/titanus unit logs smoke | grep -q TITANUS_SECURITY_OK

          # Preserve PR #6's non-root/read-only workload support and check the
          # mount flag itself so ordinary permission denial cannot mask a bug.
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit create strict-smoke --source busybox --memory 64M --pids 64 \
            --uid 65534 --gid 65534 --read-only-rootfs -- \
            /bin/sh -ec '/bin/security-probe verify 0; echo UID=$(/bin/busybox id -u) GID=$(/bin/busybox id -g); /bin/busybox grep -E " / overlay ro[, ]" /proc/mounts; echo TMP_OK > /tmp/proof; sleep 30'
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit start strict-smoke
          sleep 1
          sudo env TITANUS_STATE_ROOT="$STATE" ./bin/titanus unit logs strict-smoke | tee /tmp/titanus-strict.log
          grep -q 'UID=65534 GID=65534' /tmp/titanus-strict.log
          grep -q TITANUS_SECURITY_OK /tmp/titanus-strict.log
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit stop strict-smoke
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit delete strict-smoke

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit stop smoke

          sudo grep -q PERSISTENT_OK "$STATE/disks/smoke-data/data/proof"

          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit delete smoke

          # Successful exec is required before ACTIVE; setup and exec errors
          # fail closed and clean up the already-attached Fabric and cgroup.
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit create bad-exec --source busybox --fabric -- /bin/missing-command
          if sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit start bad-exec; then
            echo "Unexpected successful start"; exit 1
          fi
          sudo env TITANUS_STATE_ROOT="$STATE" ./bin/titanus unit inspect bad-exec | jq -e '.state.status == "FAILED" and (.state.pid // 0) == 0'
          test ! -d "$CGROUP/bad-exec"
          sudo env TITANUS_STATE_ROOT="$STATE" TITANUS_CGROUP_ROOT="$CGROUP" TITANUS_INIT_BINARY="$INIT" \
            ./bin/titanus unit delete bad-exec

      - name: Exercise lifecycle and daemon recovery
        run: sudo env "PATH=$PATH" bash scripts/ci-runtime-lifecycle.sh

      - name: Exercise health checks and restart policy
        run: sudo env "PATH=$PATH" bash scripts/ci-runtime-health.sh

      - name: Exercise native rolling updates and rollback
        run: sudo env "PATH=$PATH" TITANUS_NATIVE_ROLLOUT_TEST=1 TITANUS_INIT_BINARY="$PWD/bin/titanus-init" go test ./internal/reconcile -run TestNativeRollingRuntime -v -timeout 180s

      - name: Runtime diagnostics on failure
        if: failure()
        run: |
          sudo find /tmp/titanus-ci-state/units -name unit.log -exec tail -n 50 {} \; || true
          sudo cat /tmp/titanus-lifecycle-daemon.log || true
          sudo tail -n 50 /tmp/titanus-health-daemon.log || true

  ceph-storage:
    name: Native Ceph storage (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install native Ceph daemons and clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ceph-mon ceph-mgr ceph-osd ceph-mds ceph-common jq util-linux gdb
      - name: Real RBD and CephFS snapshot, restore, exclusion and fencing
        run: sudo env "PATH=$PATH" bash scripts/ci-ceph-storage.sh
