name: Publish verified native release candidate
on:
  workflow_run:
    workflows: [Titanus Core CI]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download packages only from the successful main run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: release-*
          path: release-packages
          merge-multiple: true
      - name: Verify exact revision and publish immutable candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITANUS_VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          TITANUS_VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: bash scripts/publish-release.sh
